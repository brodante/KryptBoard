# Publish the KryptBoard preview + live demo to GitHub Pages.
#
# The site is the `web-extension/` folder itself: index.html, the demo page and
# the real `src/` modules (the demo imports them over HTTP instead of shipping
# them bundled). Nothing is built server-side, so Pages can serve it as-is —
# except that the installable extension zip is produced during the run and
# published alongside the page.
#
# One-time setup, in the repository: Settings → Pages → Source: "GitHub Actions".
# The "Check the Pages setup" step below verifies exactly that and tells you
# which setting is wrong if the deploy cannot proceed.
#
# The published URL is https://<owner>.github.io/<repo>/ — everything on the
# page uses relative links, so it works from that sub-path unchanged.

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-extension/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Stage the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Everything that can be verified without touching Pages runs first, so a
      # misconfigured Pages setup never hides a stale bundle or a broken build.
      - name: Fail if the committed bundle is stale
        working-directory: web-extension
        run: node scripts/build.mjs --check

      - name: Build the installable extension zip
        working-directory: web-extension
        run: node scripts/build.mjs --zip

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        # Enabling Pages (or switching its source) needs repository-admin rights,
        # which the workflow token does not have. Tolerate that here and let the
        # next step say precisely which setting has to change.
        continue-on-error: true

      - name: Check the Pages setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SETTINGS="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/pages"

          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" || echo 000)

          # `build_type` is what the deploy action needs to be "workflow".
          # The `|| build_type=''` matters: under `set -o pipefail` a grep with
          # no match would otherwise abort the script *before* it can explain
          # itself (which is exactly what happens on a 404 or 403 body).
          build_type=$(grep -o '"build_type"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/pages.json 2>/dev/null \
            | sed 's/.*"\([^"]*\)"$/\1/' | head -1) || build_type=''
          echo "GET /pages → HTTP $code · build_type=${build_type:-unknown} · configure-pages=${{ steps.pages.outcome }}"

          if [ "$code" = "404" ]; then
            {
              echo "### GitHub Pages is not enabled in this repository"
              echo
              echo "Open $SETTINGS, set **Source → GitHub Actions**, then re-run this workflow"
              echo "(Actions → *Deploy demo to GitHub Pages* → **Re-run all jobs**)."
              echo
              echo "The site will then appear at ${{ github.server_url }}/${{ github.repository }}/deployments —"
              echo "and at \`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=GitHub Pages is not enabled::$SETTINGS — set Source to \"GitHub Actions\", then re-run this workflow."
            exit 1
          fi

          if [ "$code" != "200" ]; then
            echo "::warning title=Could not read the Pages settings::HTTP $code — continuing; the deploy step will report the real problem."
            exit 0
          fi

          if [ -n "$build_type" ] && [ "$build_type" != "workflow" ]; then
            {
              echo "### Pages is deploying from a branch, not from Actions"
              echo
              echo "The repository has Pages configured with \`build_type: $build_type\`."
              echo "This workflow publishes a *workflow* artifact, so the two cannot be mixed."
              echo
              echo "Open $SETTINGS, change **Source → GitHub Actions**, then re-run this workflow"
              echo "(Actions → *Deploy demo to GitHub Pages* → **Re-run all jobs**)."
              echo
              echo "Nothing else has to change: the folder published by this workflow is"
              echo "\`web-extension/\` (index.html, demo/, src/, bundle/, assets/, manifest.json and the zip),"
              echo "which is staged here and uploaded as the Pages artifact."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Pages is set to \"$build_type\", not \"GitHub Actions\"::$SETTINGS — change Source to \"GitHub Actions\", then re-run this workflow."
            exit 1
          fi

          echo "Pages is configured for GitHub Actions deployments."

      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p _site
          # everything the page actually needs
          cp -r web-extension/index.html _site/
          cp -r web-extension/demo _site/
          cp -r web-extension/src _site/
          cp -r web-extension/bundle _site/
          cp -r web-extension/assets _site/
          cp -r web-extension/manifest.json _site/
          # ...plus the freshly built zip, so the page can offer a download.
          # `kryptboard-latest.zip` is the stable name the page links to, so a
          # version bump never breaks the button.
          cp web-extension/kryptboard-*.zip _site/
          cp web-extension/kryptboard-*.zip _site/kryptboard-latest.zip
          # ...plus the paper's citation file
          cp CITATION.cff _site/
          # no Jekyll: keep every file exactly as it is on disk
          touch _site/.nojekyll

      - name: List what will be published
        run: find _site -type f | sort

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4